[package]
name = "easl"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "A high-level shader language that compiles to WGSL, with an optional CPU runtime."
license = "MIT"
repository = "https://github.com/Ella-Hoeppner/easl"
homepage = "https://easl-lang.org"
readme = "README.md"
keywords = ["shader", "wgsl", "webgpu", "lisp", "language"]
categories = ["compilers", "graphics", "rendering", "multimedia::audio"]
# What the crates.io package holds: the library, without the tests and their
# programs. `web_runtime/` is the prebuilt web runtime `publish.sh` builds.
include = [
  "/src/**/*",
  "/build.rs",
  "/web_runtime/*",
  "/README.md",
  "/LICENSE.md",
]

[dependencies]
lazy_static = "1.5.0"
fsexp = "0.1"
take_mut = "0.2.2"
thiserror = "2.0.11"
unicode-segmentation = "1.12.0"
wgpu = { version = "29.0.3", optional = true }
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }
cpal = { version = "0.15", optional = true }
libloading = { version = "0.8", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
hound = "3.5"
half = "2"
arc-swap = "1.7"
serde = { version = "1", features = ["derive", "rc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
ffmpeg-sidecar = { version = "2", optional = true }

# The MIDI listener is native-only; the web runtime gets MIDI from Web MIDI.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
midir = { version = "0.10", optional = true }

[features]
window = ["dep:wgpu", "dep:winit", "dep:pollster", "dep:cpal", "dep:midir"]
# `c_audio` swaps the audio thread's per-sample function from the bytecode VM
# (the default, portable, no-external-deps path) to a JIT-compiled C dylib
# loaded via `libloading`. Faster but requires `clang` on the host. The C
# backend is an unfinished proof of concept, not supported: much of the
# language doesn't compile to C yet, and it's to be replaced by compiling the
# VM's bytecode to C.
c_audio = ["window", "dep:libloading"]
# `video` adds MP4/etc video-frame decoding via the `ffmpeg` binary
# (subprocess, `ffmpeg-sidecar`) — no linking, needs `ffmpeg` on PATH at
# runtime.
video = ["window", "dep:ffmpeg-sidecar"]
# `web-runtime` embeds the prebuilt web runtime in `web_bundle`
# (`WEB_RUNTIME`, `COMPILER_WEB_RUNTIME`), so a program can be compiled to a
# complete web page. A checkout of the repository builds it from `web/`
# (`build.rs`), which needs the wasm32 target
# (`rustup target add wasm32-unknown-unknown`); the crate from crates.io
# carries it prebuilt.
web-runtime = ["dep:wasm-bindgen-cli-support"]

[package.metadata.docs.rs]
# Documents the runtime too (the interpreter, the GPU and audio runtimes,
# `ExternalVars`), which is behind `window`. Only on Linux: docs.rs builds
# the other targets by cross-compiling, which the audio and MIDI backends'
# system libraries don't support, and the API is the same everywhere.
features = ["window"]
targets = ["x86_64-unknown-linux-gnu"]

[build-dependencies]
# Must match the `wasm-bindgen` version `web/` pins.
wasm-bindgen-cli-support = { version = "=0.2.129", optional = true }

[dev-dependencies]
naga = { version = "29.0.3", features = ["wgsl-in"] }
# For `web_tests`: building the web runtime (must match the `wasm-bindgen`
# version `web/` pins) and driving Chrome over the DevTools protocol.
wasm-bindgen-cli-support = "=0.2.129"
tungstenite = "0.30"
serde_json = "1"

[[test]]
name = "full_tests"
harness = false

[[test]]
name = "web_tests"
harness = false
