[package]
name = "easl_web"
version = "0.0.0"
edition = "2024"

# The easl web runtime: compiled once to WebAssembly, it runs a
# precompiled easl program on the bytecode VM, rendering through WebGPU.
# Build with `web/build.sh`.

[lib]
crate-type = ["cdylib"]

[features]
# Also compile programs from their sources in the browser
# (`compileProgram`), for pages that change them as they run. This links the
# whole compiler into the runtime.
compiler = []

[dependencies]
easl = { path = "..", features = ["window"] }
wgpu = "29.0.3"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "AudioContext",
  "AudioContextState",
  "AudioDestinationNode",
  "AudioNode",
  "AudioWorklet",
  "AudioWorkletNode",
  "AudioWorkletNodeOptions",
  "BaseAudioContext",
  "console",
  "Document",
  "Element",
  "EventTarget",
  "HtmlCanvasElement",
  "KeyboardEvent",
  "MessageEvent",
  "MessagePort",
  "MouseEvent",
  "PointerEvent",
  "WheelEvent",
  "Window",
  "Worklet",
]

# Optimized for size: the runtime is a download. Natively, the bytecode
# VM runs as fast at this level as at `opt-level = 3`. Stripping drops the
# function names (about a quarter of the wasm), so a panic's stack trace in
# the browser shows function numbers.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# The runtime built with the compiler (`--features compiler`). The compiler
# runs about 1.7x slower at `opt-level = "z"`, and only slightly slower at
# "s", which matters to pages that recompile programs as they run.
[profile.release-compiler]
inherits = "release"
opt-level = "s"
