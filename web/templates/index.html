<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>easl</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="easl-canvas"></canvas>
    <script type="module">
      import { startEaslProgram } from "./easl-program.js";
      startEaslProgram(document.getElementById("easl-canvas")).catch(
        (error) => console.error(error),
      );
    </script>
  </body>
</html>
