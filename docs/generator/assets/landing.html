<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<meta name="description" content="{description}">
<link rel="stylesheet" href="landing.css">
</head>
<body>
<canvas id="hero-canvas" aria-hidden="true"></canvas>
<div class="scrim" aria-hidden="true"></div>

<nav class="top">
{nav}</nav>

<main>
<div class="intro">
<header class="hero">
{hero}</header>
<section class="get-started">
{getting_started}</section>
</div>

<section class="program" style="--program-lines: {program_lines}">
<div class="program-note">
{program_note}</div>
<div class="program-note fallback-note">
{no_webgpu}</div>
<pre class="code easl"><code>{program}</code></pre>
</section>
</main>

<script type="module">
import {{ startEaslProgram }} from "./{runtime_dir}/easl-program.js";
if (navigator.gpu) {{
  startEaslProgram(document.getElementById("hero-canvas")).catch((error) => {{
    console.error(error);
    document.body.classList.add("no-webgpu");
  }});
}} else {{
  document.body.classList.add("no-webgpu");
}}
</script>
</body>
</html>
